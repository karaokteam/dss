    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Üs Savunma DSS</title>
    <script>
      // Alt yolda (/proje/iş) sondaki "/" yoksa ekle: göreli varlık ve API yolları doğru çözülsün

    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
