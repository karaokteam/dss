# Üs Savunma DSS — Run:ai "New Workload via YAML" (Kubernetes Deployment, GPU gerekmez)
#   1) namespace satırını kendi projenle değiştir: runai-<proje-adı>
#   2) İsteğe bağlı LLM (sohbet asistanı, yeniden değerlendirme): aşağıdaki LLM_API_KEY
# Açılışta runai dalı klonlanır, kurulur, arayüz derlenir ve 8080'de sunulur (ilk açılış ~3-5 dk).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss
  namespace: runai-PROJE_ADI
  labels:
    app: dss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dss
  template:
    metadata:
      labels:
        app: dss
    spec:
      containers:
        - name: dss
          image: nikolaik/python-nodejs:python3.12-nodejs22
          command: ["bash", "-c"]
          args:
            - git clone --depth 1 --branch runai https://github.com/karaokteam/dss.git /tmp/dss && exec bash /tmp/dss/deploy/start.sh
          env:
            - name: HOME
              value: /tmp
            - name: LLM_BASE_URL
              value: https://berriailitellm-databasev1826rc3-production-d691.up.railway.app/v1
            - name: LLM_MODEL
              value: glm-5.3-flash
            # Anahtar yoksa uygulama LLM'siz çalışır (kural sonuçları + repodaki ajan çıktıları).
            # Eklemek için: "dss-llm" adlı secret (anahtar: LLM_API_KEY) ya da bu bloğu value: "<anahtar>" ile değiştir.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dss-llm
                  key: LLM_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
