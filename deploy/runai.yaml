# Üs Savunma DSS — Run:ai "Via YAML" (Knative Service: kendi adresi olur, parola yok, GPU gerekmez)
# Açılışta runai dalı klonlanır, kurulur, arayüz derlenir ve 8080'de sunulur (ilk açılış ~3-5 dk).
# Adres: https://dss-runai-trubaai.<küme alan adı>  (Run:ai iş listesinde "Connection(s)" sütunu)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dss
  namespace: runai-trubaai
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"            # hep açık, soğuk başlatma yok
        autoscaling.knative.dev/max-scale: "1"            # tek kopya: işler ve önbellekler bellekte
        serving.knative.dev/progress-deadline: "1200s"    # ilk kurulum + arayüz derlemesi için süre
    spec:
      containers:
        - image: nikolaik/python-nodejs:python3.12-nodejs22
          command: ["bash", "-c"]
          args:
            - git clone --depth 1 --branch runai https://github.com/karaokteam/dss.git /tmp/dss && exec bash /tmp/dss/deploy/start.sh
          env:
            - name: HOME
              value: /tmp
            - name: LLM_BASE_URL
              value: https://berriailitellm-databasev1826rc3-production-d691.up.railway.app/v1
            - name: LLM_MODEL
              value: glm-5.3-flash
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
